<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>iris-afterglow</title>
<style>
  html,body{margin:0;padding:0;overflow:hidden;background:#000;height:100%;width:100%;}
  canvas{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;}
  #three{z-index:1;pointer-events:none;transition:opacity 1.2s ease;}
  #c{z-index:2;}
  #startOverlay{
    position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
    flex-direction:column;color:#fff;font-family:'Hiragino Mincho ProN','游明朝',serif;
    z-index:10;background:radial-gradient(circle,#0a0a18,#000);cursor:pointer;transition:opacity .8s;
  }
  #startOverlay p{letter-spacing:0.25em;font-size:1.05rem;opacity:0.85;animation:pulse 2.2s infinite;}
  @keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
  #poemText{
    position:fixed;inset:0;z-index:5;display:flex;align-items:center;justify-content:center;
    color:#fff;font-family:'Hiragino Mincho ProN','游明朝',serif;font-size:1.2rem;
    text-align:center;padding:2rem;opacity:0;transition:opacity 3.5s ease;
    pointer-events:none;line-height:2.1;letter-spacing:0.08em;
    text-shadow:0 0 24px rgba(255,255,255,0.55);white-space:pre-line;
  }
  #backBtn{
    position:fixed;top:calc(16px + env(safe-area-inset-top,0px));left:16px;z-index:20;
    background:rgba(255,255,255,0.08);color:rgba(255,255,255,0.7);
    border:1px solid rgba(255,255,255,0.25);border-radius:17px;
    height:34px;line-height:34px;text-align:center;padding:0 12px;
    font-size:1rem;font-family:sans-serif;cursor:pointer;backdrop-filter:blur(4px);
  }
  #backBtn:active{background:rgba(255,255,255,0.18);}
</style>
</head>
<body>
<div id="startOverlay"><p>Tap, and begin the ride ―</p></div>
<button id="backBtn">← back</button>
<div id="poemText"></div>
<canvas id="three"></canvas>
<canvas id="c"></canvas>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');
  const threeCanvas = document.getElementById('three');
  const startOverlay = document.getElementById('startOverlay');
  const poemText = document.getElementById('poemText');
  const backBtn = document.getElementById('backBtn');
  let W,H;
  const cl = x => Math.max(0,Math.min(1,x));
  const sm = x => x*x*(3-2*x);
  const LEN = 150;
  const climbS = u => LEN*(0.5*u + 0.5*sm(u)); // ゆっくり始まり、ゆっくり頂上へ

  /* ===== 3D：チェーンリフトで頂上へのぼる ===== */
  const world = (function(){
    const T = THREE, rnd = Math.random;
    const renderer = new T.WebGLRenderer({canvas:threeCanvas, antialias:true});
    renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,2));
    const scene = new T.Scene();
    scene.background = new T.Color(0x07061a);
    scene.fog = new T.FogExp2(0x0b0930, 0.014);
    const cam = new T.PerspectiveCamera(72,1,0.1,700);
    const ANG = 0.42;
    const P = s => new T.Vector3(Math.sin(s*0.05)*3*Math.min(1,s/30), 2+s*Math.sin(ANG), -s*Math.cos(ANG));
    scene.add(new T.AmbientLight(0x7a6cff,0.7), new T.HemisphereLight(0xb9a8ff,0x1a1040,0.5));
    const lamp = new T.PointLight(0xffd7a8,1.4,40); scene.add(lamp);

    [-0.55,0.55].forEach(ox=>{
      const pts=[]; for(let s=-10;s<=LEN+40;s+=4){const p=P(s);p.x+=ox;pts.push(p);}
      scene.add(new T.Mesh(new T.TubeGeometry(new T.CatmullRomCurve3(pts),200,0.07,6,false),
        new T.MeshStandardMaterial({color:0xb7a6ff,emissive:0x3a2c9a,metalness:0.4,roughness:0.5})));
    });
    const N = Math.floor((LEN+40)/1.5);
    const ties = new T.InstancedMesh(new T.BoxGeometry(1.7,0.09,0.22), new T.MeshStandardMaterial({color:0x8f7bff,emissive:0x2a1f7a}), N);
    const pils = new T.InstancedMesh(new T.BoxGeometry(0.14,1,0.14), new T.MeshStandardMaterial({color:0x5b4bd0,emissive:0x1a1260}), Math.ceil(N/4)+1);
    const d = new T.Object3D(); let pi=0;
    for(let i=0;i<N;i++){
      const s=i*1.5, p=P(s);
      d.position.copy(p); d.scale.set(1,1,1); d.lookAt(P(s+1)); d.updateMatrix(); ties.setMatrixAt(i,d.matrix);
      if(i%4===0){ d.position.set(p.x,p.y/2-0.05,p.z); d.rotation.set(0,0,0); d.scale.set(1,p.y-0.1,1); d.updateMatrix(); pils.setMatrixAt(pi++,d.matrix); }
    }
    pils.count=pi; scene.add(ties,pils);

    const sg=new T.BufferGeometry(), sp=new Float32Array(1600*3);
    for(let i=0;i<1600;i++){
      const r=200+rnd()*250, th=rnd()*Math.PI*2, ph=Math.acos(0.05+rnd()*0.95);
      sp[i*3]=r*Math.sin(ph)*Math.cos(th); sp[i*3+1]=r*Math.cos(ph)+20; sp[i*3+2]=r*Math.sin(ph)*Math.sin(th)-60;
    }
    sg.setAttribute('position',new T.BufferAttribute(sp,3));
    const starMat=new T.PointsMaterial({color:0xffffff,size:1.8,sizeAttenuation:false,transparent:true,opacity:0.5,fog:false});
    scene.add(new T.Points(sg,starMat));

    const cg=new T.BufferGeometry(), cp=new Float32Array(9000), cc=new Float32Array(9000);
    for(let i=0;i<3000;i++){
      cp[i*3]=(rnd()-0.5)*260; cp[i*3+2]=-rnd()*300+40;
      const w=rnd(); cc[i*3]=1; cc[i*3+1]=0.7+w*0.25; cc[i*3+2]=0.4+w*0.4;
    }
    cg.setAttribute('position',new T.BufferAttribute(cp,3)); cg.setAttribute('color',new T.BufferAttribute(cc,3));
    scene.add(new T.Points(cg,new T.PointsMaterial({size:2.2,sizeAttenuation:false,vertexColors:true,transparent:true,opacity:0.85,fog:false})));

    const dg=new T.BufferGeometry(), dp=new Float32Array(1500);
    for(let i=0;i<500;i++){
      const q=P(rnd()*(LEN+30)), a=rnd()*Math.PI*2, rr=2+rnd()*9;
      dp[i*3]=q.x+Math.cos(a)*rr; dp[i*3+1]=q.y+Math.sin(a)*rr; dp[i*3+2]=q.z;
    }
    dg.setAttribute('position',new T.BufferAttribute(dp,3));
    scene.add(new T.Points(dg,new T.PointsMaterial({color:0xd8ccff,size:0.16,transparent:true,opacity:0.7,blending:T.AdditiveBlending,depthWrite:false})));

    const gc=document.createElement('canvas'); gc.width=gc.height=128;
    const gx=gc.getContext('2d'), gr=gx.createRadialGradient(64,64,0,64,64,64);
    gr.addColorStop(0,'rgba(255,236,210,1)'); gr.addColorStop(0.25,'rgba(190,160,255,0.45)'); gr.addColorStop(1,'rgba(90,60,200,0)');
    gx.fillStyle=gr; gx.fillRect(0,0,128,128);
    const glow=new T.Sprite(new T.SpriteMaterial({map:new T.CanvasTexture(gc),transparent:true,opacity:0.2,blending:T.AdditiveBlending,depthWrite:false,fog:false}));
    const gp=P(LEN+45); glow.position.set(gp.x,gp.y+10,gp.z); glow.scale.set(110,110,1); scene.add(glow);

    return {
      resize(){ renderer.setSize(innerWidth,innerHeight,false); cam.aspect=innerWidth/innerHeight; cam.updateProjectionMatrix(); },
      render(tc,ts){
        const u=cl(tc/CLIMB_MS), cT=Math.max(0,tc-CLIMB_MS);
        const hold=cl(cT/800), dip=cl((cT-800)/900);
        const s=climbS(u)+9*sm(dip);
        const pos=P(s);
        pos.y+=1.3+Math.sin(ts*1.1)*0.04+Math.sin(ts*37)*0.005*(tc<CLIMB_MS?(1-u)*0.5+0.2:0.05);
        cam.position.copy(pos); lamp.position.copy(pos);
        const la=P(s+12); la.y+=sm(hold)*8-sm(dip)*52;   // 頂上でふわっと見上げ、そのあと前へ傾く
        cam.lookAt(la);
        cam.rotateZ(Math.sin(ts*0.6)*0.012+Math.cos(s*0.05)*0.03*Math.min(1,s/30));
        cam.fov=72-12*sm(u)+sm(dip)*16; cam.updateProjectionMatrix();
        glow.material.opacity=0.2+0.7*sm(u)*sm(u);
        starMat.opacity=0.5+0.4*sm(u)+0.1*Math.sin(ts*2);
        renderer.render(scene,cam);
      }
    };
  })();

  function resize(){ W = canvas.width = innerWidth; H = canvas.height = innerHeight; world.resize(); }
  resize();
  addEventListener('resize', resize);

  const POEM = "Just as I am\nTo the place where I am loved —";
  const COSMOS_TEXT = "Tap to create a star";

  let audioCtx, droneGain, riserOsc, riserGain, padGain, windF, windG, busNode, noiseBuf;
  let phase = 'idle'; // idle -> coaster -> plunge -> drop -> plasma -> cosmos
  let phaseStart = 0, started = false, lastClack = -1;
  const CLIMB_MS = 13000;  // のぼる時間（チェーンリフト）
  const CREST_MS = 1500;   // 頂上の静けさ＋前へ傾く
  const PLUNGE_MS = 8400;
  const PLASMA_HOLD_MS = 18000;
  const COSMOS_FADE_MS = 6000;

  const N_PARTICLES = 140;
  let particles = [];
  function resetParticle(p){
    p.angle = Math.random()*Math.PI*2;
    p.radius = Math.max(W,H)*0.75 + Math.random()*200;
    p.speed = 2 + Math.random()*2;
    p.len = 20 + Math.random()*40;
  }
  for(let i=0;i<N_PARTICLES;i++){ const p = {}; resetParticle(p); p.radius = Math.random()*Math.max(W,H)*0.75; particles.push(p); }

  const N_FALLLINES = 60;
  let fallLines = [];
  function resetFallLine(l){ l.x = Math.random()*W; l.y = H + Math.random()*H*0.5; l.len = 30 + Math.random()*70; l.speedBase = 4 + Math.random()*6; }
  for(let i=0;i<N_FALLLINES;i++){ const l = {}; resetFallLine(l); l.y = Math.random()*H; fallLines.push(l); }

  const N_ORBS = 26;
  let orbs = [];
  function makeOrb(){ return { x: Math.random()*W, y: H + Math.random()*H*0.5, r: 10 + Math.random()*40, vy: 0.2 + Math.random()*0.5, wob: Math.random()*Math.PI*2, hue: 180 + Math.random()*140 }; }
  for(let i=0;i<N_ORBS;i++) orbs.push(makeOrb());

  const N_STARS = 180;
  let stars = [];
  function makeStar(){ return { x: (Math.random()-0.5)*W*1.6, y: (Math.random()-0.5)*H*1.6, depth: 0.15 + Math.random()*1.0, twinkle: Math.random()*Math.PI*2 }; }
  for(let i=0;i<N_STARS;i++) stars.push(makeStar());

  let myStars = [];

  backBtn.addEventListener('click', ()=>{ if(audioCtx) audioCtx.close(); location.reload(); });

  function initAudio(){
    audioCtx = new (window.AudioContext||window.webkitAudioContext)();
    const sr = audioCtx.sampleRate;
    // 残響
    const conv = audioCtx.createConvolver(), L = Math.floor(sr*2.8), ir = audioCtx.createBuffer(2,L,sr);
    for(let c=0;c<2;c++){ const d=ir.getChannelData(c); for(let k=0;k<L;k++) d[k]=(Math.random()*2-1)*Math.pow(1-k/L,2.8); }
    conv.buffer = ir;
    const wet = audioCtx.createGain(); wet.gain.value = 0.55; conv.connect(wet); wet.connect(audioCtx.destination);
    busNode = audioCtx.createGain(); busNode.connect(audioCtx.destination); busNode.connect(conv);
    noiseBuf = audioCtx.createBuffer(1,sr*2,sr);
    const nd = noiseBuf.getChannelData(0); for(let k=0;k<nd.length;k++) nd[k]=Math.random()*2-1;
    // 風（のぼるほど高く）
    const ws = audioCtx.createBufferSource(); ws.buffer = noiseBuf; ws.loop = true;
    windF = audioCtx.createBiquadFilter(); windF.type='bandpass'; windF.frequency.value=260; windF.Q.value=0.6;
    windG = audioCtx.createGain(); windG.gain.value = 0;
    ws.connect(windF); windF.connect(windG); windG.connect(busNode); ws.start();
    // 低いうなり
    const ro = audioCtx.createOscillator(); ro.type='sawtooth'; ro.frequency.value=46;
    const rf = audioCtx.createBiquadFilter(); rf.type='lowpass'; rf.frequency.value=110;
    droneGain = audioCtx.createGain(); droneGain.gain.value = 0;
    ro.connect(rf); rf.connect(droneGain); droneGain.connect(busNode); ro.start();
    // 落下の煽り上昇音
    riserOsc = audioCtx.createOscillator(); riserOsc.type = 'sine';
    riserGain = audioCtx.createGain(); riserGain.gain.value = 0;
    riserOsc.connect(riserGain).connect(audioCtx.destination); riserOsc.start();
    // プラズマのパッド（無音のまま）
    const pad1 = audioCtx.createOscillator(); pad1.type='sine'; pad1.frequency.value=220;
    const pad2 = audioCtx.createOscillator(); pad2.type='sine'; pad2.frequency.value=330;
    padGain = audioCtx.createGain(); padGain.gain.value = 0;
    pad1.connect(padGain); pad2.connect(padGain); padGain.connect(audioCtx.destination);
    pad1.start(); pad2.start();
  }

  function clack(v,pan){
    const t = audioCtx.currentTime;
    const s = audioCtx.createBufferSource(); s.buffer = noiseBuf;
    const f = audioCtx.createBiquadFilter(); f.type='bandpass'; f.frequency.value=1600+Math.random()*1000; f.Q.value=3.5;
    const g = audioCtx.createGain(); g.gain.setValueAtTime(v,t); g.gain.exponentialRampToValueAtTime(0.001,t+0.07);
    s.connect(f); f.connect(g);
    if(audioCtx.createStereoPanner){ const pn = audioCtx.createStereoPanner(); pn.pan.value = pan; g.connect(pn); pn.connect(busNode); } else g.connect(busNode);
    s.start(t, Math.random()*1.5, 0.09);
    const o = audioCtx.createOscillator(), og = audioCtx.createGain();
    o.frequency.setValueAtTime(150,t); o.frequency.exponentialRampToValueAtTime(55,t+0.09);
    og.gain.setValueAtTime(v*0.9,t); og.gain.exponentialRampToValueAtTime(0.001,t+0.12);
    o.connect(og); og.connect(busNode); o.start(t); o.stop(t+0.14);
  }

  function coasterAudio(tc){
    const u = cl(tc/CLIMB_MS), ct = audioCtx.currentTime, top = tc >= CLIMB_MS;
    windF.frequency.setTargetAtTime(260+u*1500, ct, 0.1);
    windG.gain.setTargetAtTime(top?0.012:0.03+u*0.1, ct, top?1.2:0.2);
    droneGain.gain.setTargetAtTime(top?0:0.09*(1-0.6*u), ct, 0.5);
    const idx = Math.floor(climbS(u)/2.5);
    if(!top && idx > lastClack){ lastClack = idx; clack(0.5*(1-0.6*u*u), idx%2?0.3:-0.3); }
  }

  function noiseBurst(){
    const bufferSize = audioCtx.sampleRate * 0.4;
    const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
    const data = buffer.getChannelData(0);
    for(let i=0;i<bufferSize;i++) data[i] = (Math.random()*2-1) * (1 - i/bufferSize);
    const src = audioCtx.createBufferSource(); src.buffer = buffer;
    const g = audioCtx.createGain(); g.gain.value = 0.4;
    src.connect(g).connect(audioCtx.destination);
    src.start();
  }

  function startWindNoise(durationSec){
    const bufferSize = Math.floor(audioCtx.sampleRate * durationSec);
    const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
    const data = buffer.getChannelData(0);
    for(let i=0;i<bufferSize;i++) data[i] = Math.random()*2-1;
    const src = audioCtx.createBufferSource(); src.buffer = buffer;
    const filter = audioCtx.createBiquadFilter();
    filter.type = 'bandpass'; filter.frequency.value = 500; filter.Q.value = 0.6;
    const g = audioCtx.createGain();
    g.gain.setValueAtTime(0.001, audioCtx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.18, audioCtx.currentTime + durationSec*0.85);
    g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + durationSec);
    src.connect(filter).connect(g).connect(audioCtx.destination);
    src.start();
    src.stop(audioCtx.currentTime + durationSec + 0.05);
  }

  function startExperience(){
    if(started){ if(audioCtx && audioCtx.state==='suspended') audioCtx.resume(); return; }
    started = true;
    initAudio();
    if(audioCtx.state==='suspended') audioCtx.resume();
    startOverlay.style.opacity = 0;
    setTimeout(()=> startOverlay.style.display='none', 800);
    phase = 'coaster';
    phaseStart = performance.now();
    lastClack = -1;
  }
  startOverlay.addEventListener('click', startExperience);
  startOverlay.addEventListener('touchstart', startExperience);

  function spawnMyStar(clientX, clientY){
    if(phase !== 'cosmos') return;
    const cosmosT = performance.now() - phaseStart;
    const depth = 0.88;
    const drift = cosmosT * 0.00045 * depth;
    const denom = Math.max(0.001, 1 + drift);
    myStars.push({ x: (clientX - W/2) / denom, y: (clientY - H/2) / denom, depth, twinkle: Math.PI * 0.5, bornAt: cosmosT });
  }
  canvas.addEventListener('pointerup', (e)=>{
    if(e.pointerType === 'mouse' && e.button !== 0) return;
    spawnMyStar(e.clientX, e.clientY);
  });

  function drawPlunge(t){
    const progress = Math.min(1, t/PLUNGE_MS);
    ctx.fillStyle = `rgba(0,0,8,${0.35 - 0.15*progress})`;
    ctx.fillRect(0,0,W,H);
    const speedMul = 3 + progress*22;
    for(const l of fallLines){
      l.y -= l.speedBase * speedMul;
      if(l.y < -l.len) resetFallLine(l);
      ctx.strokeStyle = `rgba(210,225,255,${0.25 + 0.5*progress})`;
      ctx.lineWidth = 1 + progress*1.5;
      ctx.beginPath(); ctx.moveTo(l.x, l.y); ctx.lineTo(l.x, l.y + l.len*(0.5+progress)); ctx.stroke();
    }
    const vig = ctx.createRadialGradient(W/2,H/2, H*0.15, W/2,H/2, H*0.75);
    vig.addColorStop(0, 'rgba(0,0,0,0)');
    vig.addColorStop(1, `rgba(0,0,10,${0.5*progress})`);
    ctx.fillStyle = vig; ctx.fillRect(0,0,W,H);
    if(progress > 0.6){
      const emerge = (progress-0.6)/0.4;
      for(let i=0;i<8;i++){
        const ox = W*0.5 + Math.sin(i*2.1+t*0.002)*W*0.35;
        const oy = H*0.5 + Math.cos(i*1.7+t*0.0025)*H*0.35;
        const r = 6+i*2;
        const g = ctx.createRadialGradient(ox,oy,0,ox,oy,r);
        g.addColorStop(0, `hsla(${190+i*8},80%,75%,${0.35*emerge})`);
        g.addColorStop(1, 'hsla(0,0%,100%,0)');
        ctx.fillStyle = g; ctx.beginPath(); ctx.arc(ox,oy,r,0,Math.PI*2); ctx.fill();
      }
    }
    const flick = Math.sin(t*0.02)*0.5+0.5;
    ctx.fillStyle = `rgba(255,255,255,${0.02*flick*progress})`;
    ctx.fillRect(0,0,W,H);
  }

  function drawDrop(now){
    const local = now - phaseStart;
    ctx.fillStyle = `rgba(255,255,255,${Math.max(0, 1 - local/500)})`;
    ctx.fillRect(0,0,W,H);
    for(const p of particles){ p.radius -= 40; if(p.radius < 10) resetParticle(p); }
  }

  function drawPlasma(t){
    const hue = (t/60) % 360;
    const grad = ctx.createRadialGradient(W/2,H*0.6,50, W/2,H*0.6, Math.max(W,H));
    grad.addColorStop(0, `hsla(${hue},70%,55%,0.5)`);
    grad.addColorStop(1, `hsla(${(hue+80)%360},60%,15%,1)`);
    ctx.fillStyle = grad; ctx.fillRect(0,0,W,H);
    ctx.globalAlpha = 0.15;
    for(let i=0;i<6;i++){
      ctx.beginPath();
      for(let x=0;x<=W;x+=20){
        const y = H*0.3 + i*40 + Math.sin(x*0.01 + t/700 + i)*30;
        x===0 ? ctx.moveTo(x,y) : ctx.lineTo(x,y);
      }
      ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 2; ctx.stroke();
    }
    ctx.globalAlpha = 1;
    for(const o of orbs){
      o.y -= o.vy; o.wob += 0.02;
      const x = o.x + Math.sin(o.wob)*15;
      if(o.y < -50) Object.assign(o, makeOrb(), {y: H+20});
      const g = ctx.createRadialGradient(x,o.y,0,x,o.y,o.r);
      g.addColorStop(0, `hsla(${o.hue},90%,80%,0.9)`);
      g.addColorStop(1, `hsla(${o.hue},90%,80%,0)`);
      ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x,o.y,o.r,0,Math.PI*2); ctx.fill();
    }
  }

  function drawCosmos(t, alpha){
    const cx = W/2, cy = H/2;
    ctx.fillStyle = `rgba(2,2,12,${alpha})`;
    ctx.fillRect(0,0,W,H);
    for(const s of stars){
      s.twinkle += 0.02;
      const drift = t*0.00045*s.depth;
      const x = cx + s.x*(1+drift);
      const y = cy + s.y*(1+drift);
      if(x < -60 || x > W+60 || y < -60 || y > H+60){ Object.assign(s, makeStar(), {x: s.x*0.04, y: s.y*0.04}); continue; }
      const tw = 0.5 + 0.5*Math.sin(s.twinkle);
      ctx.fillStyle = `rgba(255,255,255,${(0.25+0.55*tw*s.depth)*alpha})`;
      ctx.beginPath(); ctx.arc(x,y,0.6 + s.depth*1.7,0,Math.PI*2); ctx.fill();
    }
    for(const s of myStars){
      s.twinkle += 0.025;
      const drift = t*0.00045*s.depth;
      const x = cx + s.x*(1+drift);
      const y = cy + s.y*(1+drift);
      const age = Math.max(0, t - s.bornAt);
      const bloom = age < 2000 ? (1 - age/2000) : 0;
      const tw = 0.55 + 0.45*Math.sin(s.twinkle);
      if(bloom > 0){
        const br = 8 + bloom * 46;
        const bg = ctx.createRadialGradient(x,y,0,x,y,br);
        bg.addColorStop(0, `rgba(255,240,210,${0.55*bloom*alpha})`);
        bg.addColorStop(0.4, `rgba(255,210,160,${0.22*bloom*alpha})`);
        bg.addColorStop(1, 'rgba(255,210,160,0)');
        ctx.fillStyle = bg; ctx.beginPath(); ctx.arc(x,y,br,0,Math.PI*2); ctx.fill();
      }
      const haloR = 7 + tw*3;
      const hg = ctx.createRadialGradient(x,y,0,x,y,haloR);
      hg.addColorStop(0, `rgba(255,236,200,${(0.55+0.25*tw)*alpha})`);
      hg.addColorStop(1, 'rgba(255,236,200,0)');
      ctx.fillStyle = hg; ctx.beginPath(); ctx.arc(x,y,haloR,0,Math.PI*2); ctx.fill();
      ctx.fillStyle = `rgba(255,248,230,${(0.75+0.25*tw)*alpha})`;
      ctx.beginPath(); ctx.arc(x,y,1.6 + s.depth,0,Math.PI*2); ctx.fill();
    }
  }

  function loop(now){
    const ts = now/1000;
    if(phase === 'idle'){
      ctx.clearRect(0,0,W,H);
      world.render(0, ts);
    } else if(phase === 'coaster'){
      const t = now - phaseStart;
      if(t < CLIMB_MS + CREST_MS){
        world.render(t, ts);
        coasterAudio(t);
      } else {
        phase = 'plunge'; phaseStart = now;
        threeCanvas.style.opacity = 0; // 3Dをすっと溶かして、落下の演出へ
        const durSec = PLUNGE_MS/1000, ct = audioCtx.currentTime;
        riserOsc.frequency.setValueAtTime(70, ct);
        riserOsc.frequency.exponentialRampToValueAtTime(1000, ct + durSec);
        riserGain.gain.setValueAtTime(0.001, ct);
        riserGain.gain.exponentialRampToValueAtTime(0.32, ct + durSec*0.9);
        droneGain.gain.setTargetAtTime(0, ct, 0.3);
        windG.gain.setTargetAtTime(0, ct, 0.4);
        startWindNoise(durSec);
      }
    } else if(phase === 'plunge'){
      const t = now - phaseStart;
      const ct3 = CLIMB_MS + CREST_MS + t;
      if(t < 1500) world.render(ct3, ts);
      drawPlunge(t);
      if(t > PLUNGE_MS){
        phase = 'drop'; phaseStart = now;
        noiseBurst();
        riserGain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime+0.4);
      }
    } else if(phase === 'drop'){
      drawDrop(now);
      if(now - phaseStart > 900){
        phase = 'plasma'; phaseStart = now;
        const now0 = audioCtx.currentTime;
        [droneGain, riserGain, padGain, windG].forEach(g=>{
          g.gain.cancelScheduledValues(now0);
          g.gain.setValueAtTime(0, now0);
        });
        setTimeout(()=>{ poemText.style.opacity = 1; }, 3000);
        poemText.textContent = POEM;
      }
    } else if(phase === 'plasma'){
      const t = now - phaseStart;
      drawPlasma(t);
      if(t > PLASMA_HOLD_MS){
        const ft = t - PLASMA_HOLD_MS;
        const alpha = Math.min(1, ft/COSMOS_FADE_MS);
        drawCosmos(ft, alpha);
        if(alpha >= 1){
          phase = 'cosmos'; phaseStart = now;
          poemText.style.opacity = 0;
          setTimeout(()=>{ poemText.textContent = COSMOS_TEXT; poemText.style.opacity = 1; }, 1500);
        }
      }
    } else if(phase === 'cosmos'){
      drawCosmos(now - phaseStart, 1);
    }
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
})();
</script>
